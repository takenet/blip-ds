name: Publish

on:
  push:
    branches:
      - main
      - v2

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # --legacy-peer-deps temporarily added until storybook MCP addon is supported by latest storybook version
      - name: NPM Install, build and test
        run: |
          npm ci --legacy-peer-deps
          npm run assets:prepare
          node --test scripts/test/*.test.cjs
          npm run test
          npm run build
          npm run build:react
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          HUSKY: 0

      - name: Build Storybook
        run: |
          npm run storybook:build -- --output-dir ./storybook-static
        env:
          HUSKY: 0

      - name: Setup production MCP runtime
        if: github.ref == 'refs/heads/v2'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate production Storybook and MCP
        if: github.ref == 'refs/heads/v2'
        run: |
          npm ci --prefix storybook-server --ignore-scripts
          npm --prefix storybook-server test
          node storybook-server/prepare-manifest.mjs
          node storybook-server/smoke.mjs

      - name: Save tested v2 Storybook
        if: github.ref == 'refs/heads/v2'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-v2
          path: storybook-static
          retention-days: 2

      - name: Deploy Storybook to Root (preserving previews)
        uses: JamesIves/github-pages-deploy-action@v4
        env:
          CI: true
        with:
          folder: ./storybook-static
          target-folder: v2
          clean: true
          clean-exclude: |
            pr-preview
            v2
          commit-message: "docs(storybook): update storybook build"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          working_directory: blip-ds-react
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-storybook:
    needs: build
    if: always() && github.ref == 'refs/heads/v2' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: storybook-v2
          path: storybook-static
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: storybook-server/Dockerfile
          push: true
          tags: |
            ghcr.io/takenet/blip-ds-storybook:sha-${{ github.sha }}
            ghcr.io/takenet/blip-ds-storybook:${{ needs.build.outputs.version }}
          build-args: |
            RELEASE_VERSION=${{ needs.build.outputs.version }}
            RELEASE_REVISION=${{ github.sha }}
      - name: Require anonymous image pull
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect \
            "ghcr.io/takenet/blip-ds-storybook@$DIGEST" > /dev/null; then
            echo '::error::Anonymous GHCR pull failed. Ensure takenet/blip-ds-storybook allows public pulls in Package settings > Change visibility. The release pointer was not updated.'
            printf '%s\n' \
              '### Storybook image is not anonymously accessible' \
              "Image: \`ghcr.io/takenet/blip-ds-storybook@$DIGEST\`" \
              'Check [package settings](https://github.com/orgs/takenet/packages/container/blip-ds-storybook/settings) and allow public pulls before retrying this publication job.' \
              'The release pointer was not updated. Do not rerun semantic-release to recover this publication.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Update Argo release pointer
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code origin refs/heads/storybook-v2 > /dev/null; then
            git fetch origin storybook-v2
            git worktree add "$RUNNER_TEMP/storybook-release" FETCH_HEAD
            previous_revision=$(node -p "const values = require('$RUNNER_TEMP/storybook-release/release-values.json'); (values.env ?? values['blip-default-chart']?.env).RELEASE_REVISION")
            git merge-base --is-ancestor "$previous_revision" "$RELEASE_REVISION"
          else
            git worktree add --detach "$RUNNER_TEMP/storybook-release"
            git -C "$RUNNER_TEMP/storybook-release" checkout --orphan storybook-v2
            git -C "$RUNNER_TEMP/storybook-release" rm -rf .
          fi
          node storybook-server/release-values.mjs "$RUNNER_TEMP/storybook-release/release-values.json"
          git -C "$RUNNER_TEMP/storybook-release" add release-values.json
          if ! git -C "$RUNNER_TEMP/storybook-release" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/storybook-release" commit -m "chore(storybook): publish $RELEASE_VERSION"
            git -C "$RUNNER_TEMP/storybook-release" push origin HEAD:refs/heads/storybook-v2
          fi