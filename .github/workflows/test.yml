name: Run Tests

on:
  pull_request:
    branches:
      - main
      - v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@12.2.1

      - name: NPM Install and build
        run: |
          npm ci --strict-peer-deps
          npm run assets:prepare
          node --test scripts/test/*.test.cjs

      - name: Lint
        run: |
          npm run eslint
          npm run lint:uai-tokens

      # Tests currently using https://github.com/stenciljs/core/issues/6157 workaround
      # This may be slower than expected
      - name: Test
        run: |
          npm run test
      - name: Build library and React wrappers
        run: |
          npm run build
          npm run build:react
